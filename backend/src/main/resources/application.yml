spring:
  application:
    name: free-content-community

  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:free_content}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      connect-timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    # 契约要求拒绝未定义字段；同时不要全局忽略 null，
    # 因为 nextCursor 等字段在契约中是 required + nullable。
    deserialization:
      fail-on-unknown-properties: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 契约为不透明字符串 ID，使用 32 位 UUID 字符串，避免 Long 被前端当 Number
      id-type: assign_uuid

app:
  cors:
    # 多个来源用逗号分隔；前端开发地址不同时通过 CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:free-content}
    presign-ttl: 10m
    max-image-bytes: 10485760
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
  user:
    password-change:
      ip-per-minute-limit: ${PASSWORD_CHANGE_IP_PER_MINUTE_LIMIT:30}
      user-hourly-limit: ${PASSWORD_CHANGE_USER_HOURLY_LIMIT:20}
      redis-key-prefix: ${PASSWORD_CHANGE_REDIS_KEY_PREFIX:fc:auth:}
  auth:
    password-reset:
      max-code-failures: ${PASSWORD_RESET_MAX_CODE_FAILURES:5}
      ip-per-minute-limit: ${PASSWORD_RESET_IP_PER_MINUTE_LIMIT:30}
      email-hourly-limit: ${PASSWORD_RESET_EMAIL_HOURLY_LIMIT:20}
      redis-key-prefix: ${PASSWORD_RESET_REDIS_KEY_PREFIX:fc:auth:}
    registration:
      max-code-failures: ${REGISTRATION_MAX_CODE_FAILURES:5}
      ip-per-minute-limit: ${REGISTRATION_IP_PER_MINUTE_LIMIT:30}
      email-hourly-limit: ${REGISTRATION_EMAIL_HOURLY_LIMIT:20}
      argon2-memory-kib: ${REGISTRATION_ARGON2_MEMORY_KIB:19456}
      argon2-iterations: ${REGISTRATION_ARGON2_ITERATIONS:2}
      argon2-parallelism: ${REGISTRATION_ARGON2_PARALLELISM:1}
      password-hash-concurrency: ${REGISTRATION_PASSWORD_HASH_CONCURRENCY:2}
      redis-key-prefix: ${REGISTRATION_REDIS_KEY_PREFIX:fc:auth:}
    login:
      ttl-seconds: ${LOGIN_TTL_SECONDS:86400}
      max-sessions: ${LOGIN_MAX_SESSIONS:5}
      ip-per-minute-limit: ${LOGIN_IP_PER_MINUTE_LIMIT:30}
      email-window-limit: ${LOGIN_EMAIL_WINDOW_LIMIT:10}
      email-window-seconds: ${LOGIN_EMAIL_WINDOW_SECONDS:900}
      redis-key-prefix: ${LOGIN_REDIS_KEY_PREFIX:fc:auth:}
    email-challenge:
      ttl-seconds: ${EMAIL_CHALLENGE_TTL_SECONDS:600}
      resend-interval-seconds: ${EMAIL_CHALLENGE_RESEND_INTERVAL_SECONDS:60}
      email-hourly-limit: ${EMAIL_CHALLENGE_EMAIL_HOURLY_LIMIT:5}
      ip-hourly-limit: ${EMAIL_CHALLENGE_IP_HOURLY_LIMIT:100}
      max-delivery-attempts: ${EMAIL_CHALLENGE_MAX_DELIVERY_ATTEMPTS:3}
      poll-delay-millis: ${EMAIL_CHALLENGE_POLL_DELAY_MILLIS:1000}
      lease-seconds: ${EMAIL_CHALLENGE_LEASE_SECONDS:60}
      retry-base-seconds: ${EMAIL_CHALLENGE_RETRY_BASE_SECONDS:5}
      delivery-enabled: ${EMAIL_CHALLENGE_DELIVERY_ENABLED:true}
      from-address: ${EMAIL_CHALLENGE_FROM_ADDRESS:no-reply@free-content.local}
      mac-key-id: ${EMAIL_CHALLENGE_MAC_KEY_ID:v1}
      mac-key-base64: ${EMAIL_CHALLENGE_MAC_KEY_BASE64:}
      encryption-key-id: ${EMAIL_CHALLENGE_ENCRYPTION_KEY_ID:v1}
      encryption-key-base64: ${EMAIL_CHALLENGE_ENCRYPTION_KEY_BASE64:}
      redis-key-prefix: ${EMAIL_CHALLENGE_REDIS_KEY_PREFIX:fc:auth:}

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    com.freecontent.community: INFO
  pattern:
    # 把 RequestIdFilter 写入 MDC 的 requestId 带进日志，便于串联请求、审计和任务
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"
