spring:
  application:
    name: free-content-community

  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3307}/${MYSQL_DATABASE:free_content}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      connect-timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s

  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    # 契约要求拒绝未定义字段；同时不要全局忽略 null，
    # 因为 nextCursor 等字段在契约中是 required + nullable。
    deserialization:
      fail-on-unknown-properties: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 契约为不透明字符串 ID，使用 32 位 UUID 字符串，避免 Long 被前端当 Number
      id-type: assign_uuid

app:
  cors:
    # 多个来源用逗号分隔；前端开发地址不同时通过 CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:free-content}
    presign-ttl: 10m
    max-image-bytes: 10485760
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    com.freecontent.community: INFO
  pattern:
    # 把 RequestIdFilter 写入 MDC 的 requestId 带进日志，便于串联请求、审计和任务
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"
