name: free-content-web-local

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - type: bind
        source: ../../free-content-web/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
