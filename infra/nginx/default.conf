# Docker Desktop can return an IPv6 host address even when IPv6 is unreachable.
# Resolve through Docker DNS with IPv4 only, and refresh without a restart.
resolver 127.0.0.11 ipv6=off valid=30s;
upstream windows_backend {
    zone windows_backend 64k;
    server host.docker.internal:8080 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 16m;

    # Preserve the external Host (including :8088) for same-origin/CORS checks.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_intercept_errors off;
    # Do not silently retry a write request against another upstream.
    proxy_next_upstream off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No trailing slash on proxy_pass: keep /api/v1/... and the query string.
    location = /api {
        proxy_pass http://windows_backend;
    }
    location ^~ /api/ {
        proxy_pass http://windows_backend;
    }
    location = /actuator/health {
        proxy_pass http://windows_backend;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://windows_backend;
    }
    location = /swagger-ui.html {
        proxy_pass http://windows_backend;
    }
    location ^~ /swagger-ui/ {
        proxy_pass http://windows_backend;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # This origin is exclusively for real-backend integration.
    location = /mockServiceWorker.js {
        return 404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|mjs|css|map|json|ico|svg|png|jpe?g|gif|webp|woff2?|ttf)$ {
        try_files $uri =404;
    }
    # Vue Router HTML5 history: deep links can be opened/refreshed directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
