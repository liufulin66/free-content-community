name: free-content-infra

services:
  mysql:
    image: mysql:8.0
    container_name: fc-mysql
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [fc-net]

  redis:
    image: redis:7.4-alpine
    container_name: fc-redis
    restart: unless-stopped
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fc-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: fc-rabbitmq
    restart: unless-stopped
    mem_limit: 768m
    environment:
      TZ: UTC
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [fc-net]

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: fc-minio
    restart: unless-stopped
    mem_limit: 512m
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [fc-net]

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: fc-minio-init
    depends_on: [minio]
    mem_limit: 128m
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-free-content}"]
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000"
      MC_CONFIG_DIR: /tmp/.mc
      HOME: /tmp
    restart: on-failure:10
    networks: [fc-net]

  mailpit:
    image: axllent/mailpit:latest
    container_name: fc-mailpit
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    networks: [fc-net]

  # P1 搜索阶段才需要，默认不启动：
  # docker compose --profile search up -d elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fc-es
    profiles: ["search"]
    restart: unless-stopped
    mem_limit: 2g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [fc-net]

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  es_data:

networks:
  fc-net:
    driver: bridge
